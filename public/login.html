<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Internal - Coffee Shop POS & Back-Office</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #44403c 100%);
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: none;
        }

        .login-header {
            background-color: #2b1d0c;
            color: #f5f5f4;
            padding: 30px 20px;
            text-align: center;
        }

        .login-header .brand-icon {
            font-size: 2.5rem;
            color: #d97706;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 16px 12px 42px;
            font-size: 0.95rem;
            border: 1px solid #d6d3d1;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 0.25rem rgba(217, 119, 6, 0.25);
        }

        .input-group-text-custom {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #78716c;
        }

        .btn-coffee {
            background-color: #d97706;
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-coffee:hover {
            background-color: #b45309;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .alert-custom {
            font-size: 0.875rem;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card login-card">
                <!-- Header Card -->
                <div class="login-header">
                    <div class="brand-icon">
                        <i class="fa-solid fa-mug-hot"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Coffee Shop System</h4>
                    <p class="small text-warning mb-0">Back-Office & Barista Portal</p>
                </div>

                <!-- Body Card -->
                <div class="card-body p-4 p-sm-5">

                    <!-- Alert Message -->
                    <div id="alertBox" class="alert alert-danger alert-custom d-none text-center" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> <span id="alertMessage"></span>
                    </div>

                    <form id="loginForm">
                        <!-- Input Username -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Username Admin</label>
                            <div class="position-relative">
                                <i class="fa-solid fa-user input-group-text-custom"></i>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
                            </div>
                        </div>

                        <!-- Input Password -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <div class="position-relative">
                                <i class="fa-solid fa-lock input-group-text-custom"></i>
                                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="btnSubmit" class="btn btn-coffee w-100 mb-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Masuk ke Sistem
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Khusus Akses Staf / Pengelola Kedai</span>
                    </div>
                </div>
            </div>

            <!-- Footer Hak Cipta -->
            <div class="text-center mt-4">
                <small class="text-secondary">&copy; 2026 Coffee Shop POS System. All rights reserved.</small>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const alertBox = document.getElementById('alertBox');
        const alertMessage = document.getElementById('alertMessage');
        const btnSubmit = document.getElementById('btnSubmit');

        // Reset Alert
        alertBox.classList.add('d-none');

        // State Loading
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Memeriksa...`;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                // Simpan token JWT dan informasi role di browser
                localStorage.setItem('token', result.token);
                localStorage.setItem('role', result.role);

                btnSubmit.innerHTML = `<i class="fa-solid fa-check me-2"></i> Berhasil! Menghubungkan...`;
                btnSubmit.classList.replace('btn-coffee', 'btn-success');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
            } else {
                alertMessage.textContent = result.message || 'Login gagal!';
                alertBox.classList.remove('d-none');
                resetButton();
            }
        } catch (error) {
            alertMessage.textContent = 'Gagal terhubung ke server backend!';
            alertBox.classList.remove('d-none');
            resetButton();
        }

        function resetButton() {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i> Masuk ke Sistem`;
        }
    });
</script>

</body>
</html>
