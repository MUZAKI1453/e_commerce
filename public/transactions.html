<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - Coffee POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }
    </style>
</head>
<body>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        alert('Akses Ditolak! Silakan login terlebih dahulu.');
        window.location.href = '/login.html';
    }
</script>

<div class="container-fluid">
    <div class="row min-vh-100 flex-nowrap">

        <!-- CONTAINER SIDEBAR -->
        <div id="sidebarContainer" class="col-md-3 col-lg-2 p-0"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <h3 class="fw-bold mb-0"><i class="fa-solid fa-receipt text-warning me-2"></i> Riwayat Transaksi</h3>
                    <p class="text-muted small mb-0">Arsip seluruh histori pesanan dan bukti penjualan kasir</p>
                </div>

                <button class="btn btn-outline-dark btn-sm fw-semibold" onclick="loadTransactions()">
                    <i class="fa-solid fa-rotate me-1"></i> Refresh Data
                </button>
            </div>

            <!-- TABEL TRANSAKSI -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">No. Invoice</th>
                                <th>Pelanggan</th>
                                <th>Metode Bayar</th>
                                <th>Total Bayar</th>
                                <th>Status</th>
                                <th class="text-end pe-3">Waktu</th>
                            </tr>
                            </thead>
                            <tbody id="transactionTableBody">
                            <tr><td colspan="6" class="text-center py-4 text-muted">Memuat data transaksi...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadSidebar() {
        try {
            const res = await fetch('/components/sidebar.html');
            const html = await res.text();
            document.getElementById('sidebarContainer').innerHTML = html;

            const activeLink = document.querySelector('[data-page="transactions"]');
            if (activeLink) activeLink.classList.add('active');

            const toggleBtn = document.getElementById('btnToggleSidebar');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    document.body.classList.toggle('sidebar-collapsed');
                });
            }
        } catch (err) {
            console.error('Gagal memuat sidebar:', err);
        }
    }

    function handleLogout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    async function loadTransactions() {
        const tbody = document.getElementById('transactionTableBody');
        try {
            const response = await fetch('/api/transactions/history');
            const result = await response.json();
            const list = result.data || [];

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada riwayat transaksi.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(t => `
                <tr>
                    <td class="ps-3 fw-bold text-dark">${t.invoice_code || '#' + t.id}</td>
                    <td>${t.customer_name || 'Pelanggan'}</td>
                    <td><span class="badge bg-light text-dark border">${t.payment_method || 'QRIS/Cash'}</span></td>
                    <td class="fw-bold text-success">Rp ${Number(t.total_amount).toLocaleString('id-ID')}</td>
                    <td><span class="badge bg-success">${t.status}</span></td>
                    <td class="text-end pe-3 text-muted small">${new Date(t.createdAt || Date.now()).toLocaleString('id-ID')}</td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Gagal memuat riwayat transaksi.</td></tr>`;
        }
    }

    loadSidebar();
    loadTransactions();
</script>
</body>
</html>
