<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Keuangan - Coffee POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            overflow: hidden; /* Mengunci scroll body utama */
            margin: 0;
            height: 100vh;
        }

        /* Layout Fleksibel Utama */
        .app-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Transisi Kolom Sidebar & Main Content */
        #sidebarContainer, main {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mengatur Main agar flex column dan bagian isinya saja yang scroll */
        main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            overflow: hidden;
        }

        /* Sticky Header yang Solid & Aman dari Konten Menembus */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 1030;
            padding: 14px 1.5rem;
            border-bottom: 1px solid #dee2e6;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        /* Konten di bawah header yang bisa di-scroll */
        .scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Backdrop Gelap untuk Mobile/Tablet */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1035;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Pembungkus Konten agar Center dan Rapikan Lebar Maksimal */
        .main-content-wrapper {
            width: 100%;
            max-width: 1350px;
            margin-left: auto;
            margin-right: auto;
        }

        /* MODE DESKTOP (Layar >= 992px): Fitur Collapse */
        @media (min-width: 992px) {
            #sidebarContainer {
                width: 260px;
                min-width: 260px;
                flex: 0 0 260px;
                height: 100vh;
                overflow-y: auto;
            }
            main {
                flex: 1 1 auto;
                width: calc(100% - 260px);
                min-width: 0;
            }

            body.sidebar-collapsed #sidebarContainer {
                width: 75px !important;
                min-width: 75px !important;
                flex: 0 0 75px !important;
            }

            body.sidebar-collapsed main {
                width: calc(100% - 75px) !important;
            }

            body.sidebar-collapsed .sidebar-text {
                display: none !important;
            }

            body.sidebar-collapsed .sidebar .nav-link {
                justify-content: center;
                padding: 12px 0;
            }

            body.sidebar-collapsed #btnLogout {
                padding: 8px 0;
            }
        }

        /* MODE TABLET & HP / MOBILE (Layar < 992px) */
        @media (max-width: 991.98px) {
            #sidebarContainer {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 260px !important;
                min-width: 260px !important;
                height: 100vh;
                z-index: 1040;
                transform: translateX(-100%);
                overflow-y: auto;
            }

            body.sidebar-mobile-open #sidebarContainer {
                transform: translateX(0) !important;
            }

            body.sidebar-mobile-open .sidebar-backdrop {
                display: block !important;
                opacity: 1;
            }

            main {
                width: 100% !important;
                flex: 1 1 100% !important;
                min-width: 0;
            }

            .sticky-header {
                padding: 10px 1rem;
            }

            .scrollable-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        alert('Akses Ditolak! Silakan login terlebih dahulu.');
        window.location.href = '/login.html';
    }
</script>

<!-- Backdrop Gelap untuk Mobile & Tablet -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-wrapper">
    <!-- CONTAINER SIDEBAR -->
    <div id="sidebarContainer" class="p-0"></div>

    <!-- MAIN CONTENT AREA -->
    <main>
        <!-- STICKY HEADER -->
        <div class="sticky-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <!-- Tombol Hamburger Khusus Mobile/Tablet -->
                <button class="btn btn-light border d-lg-none p-2 rounded-3 shadow-sm" id="btnMobileToggle" type="button" title="Buka Menu">
                    <i class="fa-solid fa-bars text-dark"></i>
                </button>
                <div>
                    <h4 class="fw-bold mb-0 text-dark fs-5 fs-md-4"><i class="fa-solid fa-wallet text-warning me-2"></i> Log Keuangan & Arus Kas</h4>
                    <p class="text-muted small mb-0 d-none d-sm-block">Pencatatan saldo harian, pemasukan penjualan, dan pengeluaran operasional</p>
                </div>
            </div>
        </div>

        <!-- KONTEN UTAMA YANG BISA DI-SCROLL -->
        <div class="scrollable-content">
            <div class="main-content-wrapper">

                <!-- SUMMARY CARDS -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <div class="card border-0 shadow-sm p-3 border-start border-4 border-success">
                            <small class="text-muted">Total Pemasukan</small>
                            <h4 class="fw-bold text-success mb-0" id="totalIncome">Rp 0</h4>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="card border-0 shadow-sm p-3 border-start border-4 border-danger">
                            <small class="text-muted">Total Pengeluaran Operasional</small>
                            <h4 class="fw-bold text-danger mb-0" id="totalExpense">Rp 0</h4>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="card border-0 shadow-sm p-3 border-start border-4 border-primary">
                            <small class="text-muted">Net Cashflow</small>
                            <h4 class="fw-bold text-primary mb-0" id="netCashflow">Rp 0</h4>
                        </div>
                    </div>
                </div>

                <!-- TABEL LOG KEUANGAN -->
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3">
                        <h6 class="fw-bold mb-0"><i class="fa-solid fa-list-check me-2 text-warning"></i> Catatan Transaksi Kas</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Tipe</th>
                                    <th>Keterangan / Deskripsi</th>
                                    <th>Nominal</th>
                                    <th class="text-end pe-3">Tanggal</th>
                                </tr>
                                </thead>
                                <tbody id="financialLogsBody">
                                <tr><td colspan="4" class="text-center py-4 text-muted">Memuat data log keuangan...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadSidebar() {
        try {
            const res = await fetch('/components/sidebar.html');
            const html = await res.text();
            document.getElementById('sidebarContainer').innerHTML = html;

            const activeLink = document.querySelector('[data-page="financial"]');
            if (activeLink) activeLink.classList.add('active');

            // Inisialisasi event setelah sidebar selesai dimuat
            initSidebarEvents();
        } catch (err) {
            console.error('Gagal memuat sidebar:', err);
        }
    }

    function initSidebarEvents() {
        const toggleBtn = document.getElementById('btnToggleSidebar');
        const mobileToggleBtn = document.getElementById('btnMobileToggle');
        const backdrop = document.getElementById('sidebarBackdrop');
        const sidebarLinks = document.querySelectorAll('#sidebarMenu .nav-link');

        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (window.innerWidth < 992) {
                    document.body.classList.remove('sidebar-mobile-open');
                } else {
                    document.body.classList.toggle('sidebar-collapsed');
                }
            });
        }

        if (mobileToggleBtn) {
            mobileToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('sidebar-mobile-open');
            });
        }

        if (backdrop) {
            backdrop.addEventListener('click', () => {
                document.body.classList.remove('sidebar-mobile-open');
            });
        }

        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 992) {
                    document.body.classList.remove('sidebar-mobile-open');
                }
            });
        });
    }

    window.addEventListener('resize', () => {
        if (window.innerWidth >= 992) {
            document.body.classList.remove('sidebar-mobile-open');
        }
    });

    function handleLogout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    async function loadFinancialLogs() {
        const tbody = document.getElementById('financialLogsBody');
        try {
            const response = await fetch('/api/transactions/stats');
            if (response.ok) {
                const stats = await response.json();
                const income = stats.total_omset || 0;

                document.getElementById('totalIncome').textContent = `Rp ${Number(income).toLocaleString('id-ID')}`;
                document.getElementById('totalExpense').textContent = `Rp 0`;
                document.getElementById('netCashflow').textContent = `Rp ${Number(income).toLocaleString('id-ID')}`;

                tbody.innerHTML = `
                    <tr>
                        <td class="ps-3"><span class="badge bg-success">PEMASUKAN</span></td>
                        <td class="fw-semibold">Total Penjualan Kasir POS</td>
                        <td class="fw-bold text-success">Rp ${Number(income).toLocaleString('id-ID')}</td>
                        <td class="text-end pe-3 text-muted small">${new Date().toLocaleDateString('id-ID')}</td>
                    </tr>
                `;
            }
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">Gagal memuat log keuangan.</td></tr>`;
        }
    }

    loadSidebar();
    loadFinancialLogs();
</script>
</body>
</html>
