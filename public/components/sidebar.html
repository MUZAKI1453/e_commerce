<style>
    /* Styling Dasar Sidebar */
    .sidebar-container {
        width: 260px;
        flex: 0 0 260px;
        height: 100vh;
        position: sticky;
        top: 0;
        z-index: 1040;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar {
        height: 100vh;
        background-color: #1c1917 !important;
        color: #f5f5f4;
        overflow-y: auto;
        overflow-x: hidden;
    }

    .sidebar::-webkit-scrollbar {
        width: 4px;
    }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
    }

    .sidebar .nav-link {
        color: #a8a29e;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }

    .sidebar .nav-link:hover {
        color: #ffffff;
        background-color: rgba(217, 119, 6, 0.2);
    }

    .sidebar .nav-link.active {
        color: #ffffff !important;
        background-color: #d97706 !important;
        font-weight: 600;
    }

    .hover-warning:hover i {
        color: #d97706 !important;
    }

    /* Backdrop Gelap untuk Mobile/Tablet saat Sidebar Terbuka */
    .sidebar-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1035;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    /* MODE DESKTOP (Layar >= 992px): Fitur Collapse */
    @media (min-width: 992px) {
        body.sidebar-collapsed .sidebar-container {
            width: 75px !important;
            flex: 0 0 75px !important;
            max-width: 75px !important;
        }

        body.sidebar-collapsed .sidebar-text {
            display: none !important;
        }

        body.sidebar-collapsed .sidebar .nav-link {
            justify-content: center !important;
            padding: 12px 0 !important;
        }

        body.sidebar-collapsed #btnLogout {
            padding: 8px 0 !important;
            justify-content: center !important;
        }

        body.sidebar-collapsed .brand-container {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        body.sidebar-collapsed .brand-wrapper {
            display: none !important;
        }
    }

    /* MODE TABLET & HP / MOBILE (Layar < 992px): Drawer Melayang dari Kiri */
    @media (max-width: 991.98px) {
        .sidebar-container {
            position: fixed !important;
            left: 0;
            top: 0;
            transform: translateX(-100%); /* Sembunyikan mulus menggunakan transform */
            width: 260px !important;
            flex: 0 0 260px !important;
        }

        /* Ketika aktif/terbuka di mobile/tablet */
        body.sidebar-mobile-open .sidebar-container {
            transform: translateX(0) !important;
        }

        body.sidebar-mobile-open .sidebar-backdrop {
            display: block !important;
            opacity: 1;
        }
    }
</style>

<script>
    (function initResponsiveSidebar() {
        const toggleBtn = document.getElementById('btnToggleSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        const sidebarLinks = document.querySelectorAll('#sidebarMenu .nav-link');

        if (toggleBtn) {
            toggleBtn.replaceWith(toggleBtn.cloneNode(true));
            const newToggleBtn = document.getElementById('btnToggleSidebar');

            newToggleBtn.addEventListener('click', function () {
                if (window.innerWidth < 992) {
                    // Mobile / Tablet: Toggle Drawer Melayang
                    document.body.classList.toggle('sidebar-mobile-open');
                } else {
                    // Desktop: Toggle Lebar/Kecil Sidebar (Collapse)
                    document.body.classList.toggle('sidebar-collapsed');
                }
            });
        }

        if (backdrop) {
            backdrop.replaceWith(backdrop.cloneNode(true));
            const newBackdrop = document.getElementById('sidebarBackdrop');

            newBackdrop.addEventListener('click', function () {
                document.body.classList.remove('sidebar-mobile-open');
            });
        }

        // UX Tambahan: Otomatis menutup sidebar di mobile ketika salah satu menu diklik
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth < 992) {
                    document.body.classList.remove('sidebar-mobile-open');
                }
            });
        });

        // Handle penyesuaian otomatis jika ukuran layar diubah (Resize handler)
        window.addEventListener('resize', function () {
            if (window.innerWidth >= 992) {
                document.body.classList.remove('sidebar-mobile-open');
            }
        });
    })();
</script>
