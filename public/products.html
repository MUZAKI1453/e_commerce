<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Menu & Stok - Coffee POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }
        /* Memberikan ruang bernapas agar layout tidak terasa terlalu padat */
        .main-content-wrapper {
            max-width: 1350px;
            margin: 0 auto;
        }
        .table td, .table th {
            padding: 1rem 0.75rem; /* Padding baris tabel lebih longgar */
        }
    </style>
</head>
<body>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        alert('Akses Ditolak! Silakan login terlebih dahulu.');
        window.location.href = '/login.html';
    }
</script>

<div class="container-fluid">
    <div class="row min-vh-100 flex-nowrap">

        <!-- CONTAINER SIDEBAR -->
        <div id="sidebarContainer" class="col-md-3 col-lg-2 p-0"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="main-content-wrapper py-2">

                <!-- HEADER HALAMAN -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
                    <div>
                        <h3 class="fw-bold mb-1"><i class="fa-solid fa-boxes-stacked text-warning me-2"></i> Kelola Menu & Stok</h3>
                        <p class="text-muted small mb-0">Manajemen daftar produk, harga, dan ketersediaan stok bahan kedai kopi</p>
                    </div>

                    <button class="btn btn-warning fw-semibold text-white px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        <i class="fa-solid fa-plus me-1"></i> Tambah Menu Baru
                    </button>
                </div>

                <!-- SEARCH BAR & FILTER SECTION -->
                <div class="row mb-4">
                    <div class="col-md-5 col-lg-4">
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-end-0 ps-3"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0 py-2" placeholder="Cari nama produk atau kategori...">
                        </div>
                    </div>
                </div>

                <!-- TABEL KELOLA PRODUK -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-uppercase fs-7 text-secondary">
                                <tr>
                                    <th class="ps-4 py-3" style="width: 70px;">No</th>
                                    <th class="py-3" style="width: 90px;">Gambar</th>
                                    <th class="py-3">Nama Produk</th>
                                    <th class="py-3">Kategori</th>
                                    <th class="py-3">Harga</th>
                                    <th class="py-3">Stok</th>
                                    <th class="text-end pe-4 py-3" style="width: 150px;">Aksi</th>
                                </tr>
                                </thead>
                                <tbody id="productTableBody">
                                <tr><td colspan="7" class="text-center py-5 text-muted">Memuat data produk...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL TAMBAH PRODUK -->
<!-- ========================================== -->
<div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus-circle text-warning me-2"></i>Tambah Produk Baru</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addProductForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Produk</label>
                        <input type="text" id="prodName" class="form-control" placeholder="Contoh: Espresso Double" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Kategori</label>
                        <select id="prodCategory" class="form-select" required>
                            <option value="Coffee">Coffee</option>
                            <option value="Non-Coffee">Non-Coffee</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Harga (Rp)</label>
                            <input type="number" id="prodPrice" class="form-control" placeholder="18000" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Jumlah Stok</label>
                            <input type="number" id="prodStock" class="form-control" placeholder="50" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Deskripsi (Opsional)</label>
                        <textarea id="prodDesc" class="form-control" rows="2" placeholder="Keterangan produk..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">URL Link Gambar (Opsional)</label>
                        <input type="url" id="prodImage" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                </div>
                <div class="modal-footer bg-light px-4 py-3">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-warning text-white fw-semibold px-4">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL DETAIL / LIHAT PRODUK -->
<!-- ========================================== -->
<div class="modal fade" id="viewProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-eye text-warning me-2"></i>Detail Produk</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="text-center mb-4">
                    <div id="viewProductImgContainer" class="mb-3">
                        <!-- Tempat gambar produk dimuat -->
                    </div>
                    <h4 id="viewProductName" class="fw-bold text-dark mb-1"></h4>
                    <span id="viewProductCategory" class="badge bg-light text-dark border"></span>
                </div>

                <div class="bg-light p-3 rounded-3 border">
                    <div class="row mb-2">
                        <div class="col-4 fw-semibold text-muted">Harga</div>
                        <div class="col-8 text-success fw-bold" id="viewProductPrice"></div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-4 fw-semibold text-muted">Stok</div>
                        <div class="col-8 text-dark" id="viewProductStock"></div>
                    </div>
                    <div class="row">
                        <div class="col-4 fw-semibold text-muted">Deskripsi</div>
                        <div class="col-8 text-dark" id="viewProductDesc"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light px-4 py-3">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL EDIT PRODUK -->
<!-- ========================================== -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square text-warning me-2"></i>Edit Produk</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editProductForm">
                <input type="hidden" id="editProdId">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Produk</label>
                        <input type="text" id="editProdName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Kategori</label>
                        <select id="editProdCategory" class="form-select" required>
                            <option value="Coffee">Coffee</option>
                            <option value="Non-Coffee">Non-Coffee</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Harga (Rp)</label>
                            <input type="number" id="editProdPrice" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Jumlah Stok</label>
                            <input type="number" id="editProdStock" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Deskripsi (Opsional)</label>
                        <textarea id="editProdDesc" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">URL Link Gambar (Opsional)</label>
                        <input type="url" id="editProdImage" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                </div>
                <div class="modal-footer bg-light px-4 py-3">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-warning text-white fw-semibold px-4">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allProducts = [];

    async function loadSidebar() {
        try {
            const res = await fetch('/components/sidebar.html');
            const html = await res.text();
            document.getElementById('sidebarContainer').innerHTML = html;

            const activeLink = document.querySelector('[data-page="products"]');
            if (activeLink) activeLink.classList.add('active');

            const toggleBtn = document.getElementById('btnToggleSidebar');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    document.body.classList.toggle('sidebar-collapsed');
                });
            }
        } catch (err) {
            console.error('Gagal memuat sidebar:', err);
        }
    }

    function handleLogout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    // Fungsi Render Tabel dengan Nomor Urut mulai dari 1
    function renderTable(products) {
        const tbody = document.getElementById('productTableBody');

        if (products.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted">Tidak ada produk yang ditemukan.</td></tr>`;
            return;
        }

        tbody.innerHTML = products.map((p, index) => {
            const imageTag = p.image_url
                ? `<img src="${p.image_url}" alt="${p.name}" class="rounded shadow-sm" style="width: 45px; height: 45px; object-fit: cover;" onerror="this.onerror=null; this.src='https://via.placeholder.com/45?text=Error';">`
                : `<span class="badge bg-secondary text-light p-2" style="font-size: 10px;">No Image</span>`;

            return `
                <tr>
                    <td class="ps-4 fw-bold text-secondary">${index + 1}</td>
                    <td>${imageTag}</td>
                    <td class="fw-semibold text-dark">${p.name}</td>
                    <td><span class="badge bg-light text-dark border px-2 py-1">${p.category || 'General'}</span></td>
                    <td class="fw-bold text-success">Rp ${Number(p.price).toLocaleString('id-ID')}</td>
                    <td>
                        <span class="badge ${p.stock < 10 ? 'bg-danger' : 'bg-success'} px-2 py-1">
                            ${p.stock} pcs
                        </span>
                    </td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-info me-1" onclick="openViewModal(${p.id})" title="Lihat Detail">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${p.id})" title="Edit">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})" title="Hapus">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            const result = await response.json();
            allProducts = result.data || [];
            renderTable(allProducts);
        } catch (e) {
            document.getElementById('productTableBody').innerHTML = `<tr><td colspan="7" class="text-center py-5 text-danger">Gagal memuat produk.</td></tr>`;
        }
    }

    // Fitur Pencarian Real-time
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = allProducts.filter(p =>
            p.name.toLowerCase().includes(keyword) ||
            (p.category && p.category.toLowerCase().includes(keyword))
        );
        renderTable(filtered);
    });

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('prodName').value;
        const category = document.getElementById('prodCategory').value;
        const price = document.getElementById('prodPrice').value;
        const stock = document.getElementById('prodStock').value;
        const description = document.getElementById('prodDesc').value;
        const image_url = document.getElementById('prodImage').value;

        try {
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, category, price: Number(price), stock: Number(stock), description, image_url })
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
                document.getElementById('addProductForm').reset();
                loadProducts();
            } else {
                alert('Gagal menambah produk.');
            }
        } catch (err) {
            console.error('Add product error:', err);
        }
    });

    function openViewModal(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        document.getElementById('viewProductName').innerText = product.name;
        document.getElementById('viewProductCategory').innerText = product.category || 'Coffee';
        document.getElementById('viewProductPrice').innerText = `Rp ${Number(product.price).toLocaleString('id-ID')}`;
        document.getElementById('viewProductStock').innerText = `${product.stock} pcs`;
        document.getElementById('viewProductDesc').innerText = product.description || 'Tidak ada deskripsi.';

        const imgContainer = document.getElementById('viewProductImgContainer');
        if (product.image_url) {
            imgContainer.innerHTML = `<img src="${product.image_url}" alt="${product.name}" class="rounded shadow-sm border" style="width: 120px; height: 120px; object-fit: cover;">`;
        } else {
            imgContainer.innerHTML = `<div class="text-muted fst-italic p-3 bg-light rounded border">Tidak ada gambar produk</div>`;
        }

        const viewModal = new bootstrap.Modal(document.getElementById('viewProductModal'));
        viewModal.show();
    }

    function openEditModal(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        document.getElementById('editProdId').value = product.id;
        document.getElementById('editProdName').value = product.name;
        document.getElementById('editProdCategory').value = product.category || 'Coffee';
        document.getElementById('editProdPrice').value = product.price;
        document.getElementById('editProdStock').value = product.stock;
        document.getElementById('editProdDesc').value = product.description || '';
        document.getElementById('editProdImage').value = product.image_url || '';

        const editModal = new bootstrap.Modal(document.getElementById('editProductModal'));
        editModal.show();
    }

    document.getElementById('editProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editProdId').value;
        const name = document.getElementById('editProdName').value;
        const category = document.getElementById('editProdCategory').value;
        const price = document.getElementById('editProdPrice').value;
        const stock = document.getElementById('editProdStock').value;
        const description = document.getElementById('editProdDesc').value;
        const image_url = document.getElementById('editProdImage').value;

        try {
            const res = await fetch(`/api/products/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, category, price: Number(price), stock: Number(stock), description, image_url })
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
                loadProducts();
            } else {
                alert('Gagal memperbarui produk.');
            }
        } catch (err) {
            console.error('Edit product error:', err);
        }
    });

    async function deleteProduct(id) {
        if (!confirm('Apakah Anda yakin ingin menghapus produk ini?')) return;
        try {
            const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            if (res.ok) loadProducts();
        } catch (e) {
            console.error('Delete product error:', e);
        }
    }

    loadSidebar();
    loadProducts();
</script>
</body>
</html>
